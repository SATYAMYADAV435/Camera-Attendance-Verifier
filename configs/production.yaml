system:
  environment: production
  app_name: "Intelligent Office Access Management System"
  debug: false
  api_prefix: "/api/v1"
  secret_key: "${JWT_SECRET_KEY}"
  jwt_algorithm: "HS256"
  access_token_expire_minutes: 60

security:
  fail_secure: true
  require_liveness_for_biometric: true
  allow_cardless_access_default: false
  enforce_time_restrictions: true
  biometric_encryption_key: "${BIOMETRIC_ENCRYPTION_KEY}"

identity:
  w_face: 0.35
  w_body: 0.15
  w_live: 0.20
  w_card: 0.15
  w_time: 0.08
  w_context: 0.07

  face_threshold: 0.70
  body_threshold: 0.65
  liveness_threshold: 0.75
  minimum_quality: 0.60
  
  high_confidence_threshold: 0.80
  medium_confidence_threshold: 0.60

tailgating:
  enabled: true
  authentication_window_seconds: 4.0
  door_crossing_window_seconds: 3.0
  max_allowed_distance_pixels: 100.0

multi_camera:
  enabled: true
  reid_similarity_threshold: 0.70
  max_transit_time_seconds: 120.0
  min_transit_time_seconds: 2.0

camera:
  heartbeat_timeout_seconds: 20.0
  failure_timeout_seconds: 45.0
  frozen_frame_detection: true
  frozen_frame_threshold: 15
  blur_laplacian_threshold: 50.0
  default_fps: 30.0

elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST:-http://elasticsearch:9200}"]
  index_prefix: "office-access"
  enable_in_memory_fallback: false

redis:
  host: "${REDIS_HOST:-redis}"
  port: 6379
  db: 0
  enable_in_memory_fallback: false

retention:
  access_events_days: 180
  observations_days: 30
  incidents_days: 730
  audit_logs_days: 1825
